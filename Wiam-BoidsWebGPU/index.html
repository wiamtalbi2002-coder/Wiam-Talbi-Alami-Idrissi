<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiam-BoidsWebGPU — murmuration WebGPU</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dbe5ee;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .panel { position: fixed; top: 14px; left: 14px; width: 230px; padding: 14px 16px;
      border-radius: 14px; background: rgba(30, 30, 38, 0.82); color: #f1f1f4;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); font-size: 13px; user-select: none; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .head h1 { margin: 0; font-size: 17px; font-weight: 700; }
    #fps { color: #8ee08e; font-weight: 600; font-size: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; }
    .seg { display: flex; background: rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: transparent; color: #c9c9d2; padding: 4px 14px;
      border-radius: 6px; font: inherit; cursor: pointer; }
    .seg button.active { background: rgba(255, 255, 255, 0.2); color: #fff; }
    #countValue { font-weight: 700; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: #7c8cff; margin: 4px 0 0; }
    .limits { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.5; }
    .switch { position: relative; width: 38px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 22px; background: #555; cursor: pointer; transition: 0.2s; }
    .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      border-radius: 50%; background: #fff; transition: 0.2s; }
    .switch input:checked + span { background: #6f7dff; }
    .switch input:checked + span::before { transform: translateX(16px); }
    .hint { margin-top: 12px; font-size: 11px; line-height: 1.45; opacity: 0.6; }
    body.flat .hint .fly { display: none; }
    #error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 40px; background: #1e1e26; color: #ffd0d0; font-size: 18px; text-align: center; }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="gfx"></canvas>

  <div class="panel">
    <div class="head"><h1>Boids</h1><span id="fps">– FPS</span></div>
    <div class="row">
      <span>Vue</span>
      <div class="seg">
        <button data-view="2d">2D</button>
        <button data-view="3d" class="active">3D</button>
      </div>
    </div>
    <div class="row"><span>Nombre</span><span id="countValue">0</span></div>
    <input id="count" type="range" min="0" max="1000" step="1">
    <div class="limits"><span>100</span><span id="countMax">–</span></div>
    <div class="row">
      <span>Oiseaux</span>
      <label class="switch"><input id="birds" type="checkbox" checked><span></span></label>
    </div>
    <div class="hint">
      Glisser pour regarder autour<span class="fly"><br>ZQSD pour voler, A / E pour descendre / monter<br>Maj pour voler plus vite</span>
    </div>
  </div>

  <div id="error" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
